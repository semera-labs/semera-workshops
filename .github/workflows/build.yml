name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
    branches:
      - master

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build (no publish for branches)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run build

      - name: Release build (publish for tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      # --- Windows artifact ---
      - name: Zip win-unpacked (Windows only)
        if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        run: |
          powershell Compress-Archive -Path dist/win-unpacked -DestinationPath dist/win-unpacked.zip -Force

      # --- macOS artifact ---
      - name: Zip .app using ditto (macOS only)
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/')
        run: |
          APP_NAME=$(ls dist/mac-arm64 | grep '.app$' | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "dist/mac-arm64/$APP_NAME" "dist/${APP_NAME}.zip"

      - name: Upload Windows .zip
        if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: dist/win-unpacked.zip

      - name: Upload macOS .app.zip
        if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*.app.zip
